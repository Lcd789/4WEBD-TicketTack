services:
  # Infrastructure
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db
    networks:
      - tickettack-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tickettack-network

  # Microservices
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AuthService__Url=http://auth-service
      - EventService__Url=http://event-service
      - TicketService__Url=http://ticket-service
      - UserService__Url=http://user-service
      - NotificationService__Url=http://notification-service
    depends_on:
      - auth-service
      - event-service
      - ticket-service
      - user-service
      - notification-service
    networks:
      - tickettack-network

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://admin:password@mongodb:27017
      - MongoDb__DatabaseName=TicketTack
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=password
      - RabbitMQ__Port=5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - tickettack-network

  event-service:
    build:
      context: .
      dockerfile: src/EventService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://admin:password@mongodb:27017
      - MongoDb__DatabaseName=TicketTack
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=password
      - RabbitMQ__Port=5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - tickettack-network

  ticket-service:
    build:
      context: .
      dockerfile: src/TicketService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://admin:password@mongodb:27017
      - MongoDb__DatabaseName=TicketTack
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=password
      - RabbitMQ__Port=5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - tickettack-network

  user-service:
    build:
      context: .
      dockerfile: src/UserService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://admin:password@mongodb:27017
      - MongoDb__DatabaseName=TicketTack
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=password
      - RabbitMQ__Port=5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - tickettack-network

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://admin:password@mongodb:27017
      - MongoDb__DatabaseName=TicketTack
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=password
      - RabbitMQ__Port=5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - tickettack-network

  blazor-web:
    build:
      context: .
      dockerfile: front/BlazorWeb/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiGateway__Url=http://api-gateway
    depends_on:
      - api-gateway
    networks:
      - tickettack-network

networks:
  tickettack-network:
    driver: bridge

volumes:
  mongodb_data:
  rabbitmq_data: